<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ツアマス シナジー＆スマイル計算ツール（プロトタイプ）</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #ff5a8a;
      --primary-soft: #ffe6ee;
      --accent: #3b82f6;
      --accent-soft: #e0edff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0 0 4px;
    }

    header p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    /* アイドル選択グリッド */
    .idol-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 8px;
    }

    .idol-btn {
      border: 2px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .idol-btn:hover {
      border-color: #cbd5e1;
    }

    .idol-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .idol-name {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .idol-meta {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .selected-summary {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* シナジー結果 */
    .synergy-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .synergy-item {
      border-left: 4px solid var(--primary);
      background: #fff8fa;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .synergy-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #be185d;
    }

    .synergy-desc {
      font-size: 0.82rem;
      color: var(--text);
      margin-top: 2px;
    }

    .empty-msg {
      font-size: 0.88rem;
      color: var(--muted);
      background: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    /* 衣装・アクセ選択 */
    .equip-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 540px) {
      .equip-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--muted);
    }

    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.92rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .smile-box {
      margin-top: 14px;
      background: var(--accent-soft);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .smile-breakdown {
      font-size: 0.82rem;
      color: #1e40af;
    }

    .smile-total {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1d4ed8;
    }

    .btn-reset {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ツアマス シナジー＆スマイル計算（試作）</h1>
      <p>※ダミーデータ入りのプロトタイプです。JS内のマスタデータを書き換えて使います。</p>
    </header>

    <!-- 1. アイドル3人選択 -->
    <section class="panel">
      <div class="panel-title">
        <span>① アイドルを3人選択</span>
        <span class="badge" id="selectedCountBadge">0 / 3人</span>
      </div>
      <div class="idol-grid" id="idolGrid"></div>
      <div class="selected-summary" id="selectedSummary">選択中：なし</div>
    </section>

    <!-- 2. リンクシナジー判定 -->
    <section class="panel">
      <div class="panel-title">
        <span>② 発動リンクシナジー</span>
      </div>
      <ul class="synergy-list" id="synergyList"></ul>
    </section>

    <!-- 3. 衣装・アクセ選択＆スマイル計算 -->
    <section class="panel">
      <div class="panel-title">
        <span>③ 衣装・アクセサリー選択</span>
        <button type="button" class="btn-reset" id="resetEquipBtn">選択リセット</button>
      </div>
      <div class="equip-row">
        <div>
          <label for="costumeSelect">衣装カード</label>
          <select id="costumeSelect"></select>
        </div>
        <div>
          <label for="accessorySelect">アクセサリーカード</label>
          <select id="accessorySelect"></select>
        </div>
      </div>

      <div class="smile-box">
        <div class="smile-breakdown" id="smileBreakdown">
          衣装: 0 ＋ アクセ: 0 ＋ シナジー補正: 0
        </div>
        <div class="smile-total" id="smileTotal">0</div>
      </div>
    </section>
  </div>

  <script>
    // ==========================================
    // マスタデータ（ここを実データに差し替え）
    // ==========================================
    const IDOLS = [
      { id: "haruka", name: "天海春香", brand: "765AS", blood: "O", month: 4 },
      { id: "chihaya", name: "如月千早", brand: "765AS", blood: "A", month: 2 },
      { id: "uzuki", name: "島村卯月", brand: "CG", blood: "O", month: 4 },
      { id: "rin", name: "渋谷凛", brand: "CG", blood: "B", month: 8 },
      { id: "mirai", name: "春日未来", brand: "ML", blood: "O", month: 6 },
      { id: "momoko", name: "周防桃子", brand: "ML", blood: "A", month: 11 },
    ];

    // 条件関数(selectedIdols)が true を返すと発動するダミー定義
    const SYNERGIES = [
      {
        id: "syn_blood_all",
        name: "血液型一致シナジー（ダミー）",
        desc: "選択した3人の血液型がすべて同じ場合に発動",
        smileBonus: 120,
        check: (selected) =>
          selected.length === 3 &&
          selected[0].blood === selected[1].blood &&
          selected[1].blood === selected[2].blood,
      },
      {
        id: "syn_brand_all",
        name: "同一ブランドシナジー（ダミー）",
        desc: "選択した3人の所属ブランドがすべて同じ場合に発動",
        smileBonus: 150,
        check: (selected) =>
          selected.length === 3 &&
          selected[0].brand === selected[1].brand &&
          selected[1].brand === selected[2].brand,
      },
      {
        id: "syn_spring_duo",
        name: "春生まれ含む編成（ダミー）",
        desc: "3〜5月生まれのアイドルが1人以上入っていると発動",
        smileBonus: 50,
        check: (selected) =>
          selected.length === 3 &&
          selected.some((idol) => idol.month >= 3 && idol.month <= 5),
      },
    ];

    const COSTUMES = [
      { id: "none", name: "（未選択）", smile: 0 },
      { id: "c_starlight", name: "スターライトドレス（SSR/ダミー）", smile: 680 },
      { id: "c_stage", name: "フレッシュステージ衣装（SR/ダミー）", smile: 490 },
      { id: "c_casual", name: "レッスンウェア（R/ダミー）", smile: 310 },
    ];

    const ACCESSORIES = [
      { id: "none", name: "（未選択）", smile: 0 },
      { id: "a_tiara", name: "プリンセスティアラ（SSR/ダミー）", smile: 340 },
      { id: "a_ribbon", name: "ハッピーリボン（SR/ダミー）", smile: 230 },
      { id: "a_bangle", name: "リズムバングル（R/ダミー）", smile: 140 },
    ];

    // ==========================================
    // アプリ状態
    // ==========================================
    const MAX_SELECTED = 3;
    let selectedIdolIds = [];

    const idolGridEl = document.getElementById("idolGrid");
    const selectedCountBadgeEl = document.getElementById("selectedCountBadge");
    const selectedSummaryEl = document.getElementById("selectedSummary");
    const synergyListEl = document.getElementById("synergyList");
    const costumeSelectEl = document.getElementById("costumeSelect");
    const accessorySelectEl = document.getElementById("accessorySelect");
    const smileBreakdownEl = document.getElementById("smileBreakdown");
    const smileTotalEl = document.getElementById("smileTotal");
    const resetEquipBtnEl = document.getElementById("resetEquipBtn");

    // 初期描画
    function init() {
      renderIdolButtons();
      renderSelectOptions(costumeSelectEl, COSTUMES);
      renderSelectOptions(accessorySelectEl, ACCESSORIES);

      costumeSelectEl.addEventListener("change", updateAll);
      accessorySelectEl.addEventListener("change", updateAll);
      resetEquipBtnEl.addEventListener("click", () => {
        costumeSelectEl.value = "none";
        accessorySelectEl.value = "none";
        updateAll();
      });

      updateAll();
    }

    function renderIdolButtons() {
      idolGridEl.innerHTML = "";
      IDOLS.forEach((idol) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "idol-btn";
        btn.dataset.id = idol.id;
        btn.innerHTML = `
          <span class="idol-name">${idol.name}</span>
          <span class="idol-meta">${idol.brand} / ${idol.blood}型 / ${idol.month}月</span>
        `;
        btn.addEventListener("click", () => toggleIdol(idol.id));
        idolGridEl.appendChild(btn);
      });
    }

    function toggleIdol(idolId) {
      const idx = selectedIdolIds.indexOf(idolId);
      if (idx !== -1) {
        selectedIdolIds.splice(idx, 1);
      } else {
        if (selectedIdolIds.length >= MAX_SELECTED) {
          // 3人選択済みの場合は一番古い選択を外して新しいものを入れる（操作しやすさ重視）
          selectedIdolIds.shift();
        }
        selectedIdolIds.push(idolId);
      }
      updateAll();
    }

    function renderSelectOptions(selectEl, items) {
      selectEl.innerHTML = "";
      items.forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.id === "none" ? item.name : `${item.name}（+${item.smile}）`;
        selectEl.appendChild(opt);
      });
    }

    function getSelectedIdols() {
      return selectedIdolIds
        .map((id) => IDOLS.find((idol) => idol.id === id))
        .filter(Boolean);
    }

    function updateAll() {
      const selectedIdols = getSelectedIdols();

      // ボタンの選択状態更新
      document.querySelectorAll(".idol-btn").forEach((btn) => {
        btn.classList.toggle("selected", selectedIdolIds.includes(btn.dataset.id));
      });

      selectedCountBadgeEl.textContent = `${selectedIdols.length} / ${MAX_SELECTED}人`;
      selectedSummaryEl.textContent =
        selectedIdols.length > 0
          ? `選択中：${selectedIdols.map((i) => i.name).join(" / ")}`
          : "選択中：なし";

      // シナジー判定
      const activeSynergies =
        selectedIdols.length === MAX_SELECTED
          ? SYNERGIES.filter((syn) => syn.check(selectedIdols))
          : [];

      renderSynergies(selectedIdols.length, activeSynergies);

      // スマイル計算
      const costume = COSTUMES.find((c) => c.id === costumeSelectEl.value) || COSTUMES[0];
      const accessory = ACCESSORIES.find((a) => a.id === accessorySelectEl.value) || ACCESSORIES[0];
      const synergyBonus = activeSynergies.reduce((sum, syn) => sum + (syn.smileBonus || 0), 0);

      const totalSmile = costume.smile + accessory.smile + synergyBonus;
      smileBreakdownEl.textContent =
        `衣装: ${costume.smile} ＋ アクセ: ${accessory.smile} ＋ シナジー補正(仮): ${synergyBonus}`;
      smileTotalEl.textContent = totalSmile.toLocaleString();
    }

    function renderSynergies(selectedCount, activeSynergies) {
      synergyListEl.innerHTML = "";

      if (selectedCount < MAX_SELECTED) {
        synergyListEl.innerHTML = `<li class="empty-msg">アイドルを3人選ぶとリンクシナジーを判定します。</li>`;
        return;
      }

      if (activeSynergies.length === 0) {
        synergyListEl.innerHTML = `<li class="empty-msg">条件を満たすリンクシナジーはありませんでした。</li>`;
        return;
      }

      activeSynergies.forEach((syn) => {
        const li = document.createElement("li");
        li.className = "synergy-item";
        li.innerHTML = `
          <div class="synergy-name">${syn.name}（+${syn.smileBonus}）</div>
          <div class="synergy-desc">${syn.desc}</div>
        `;
        synergyListEl.appendChild(li);
      });
    }

    init();
  </script>
</body>
</html>
